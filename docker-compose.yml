version: "3.9"

services:
  inventario:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario_t2
    restart: unless-stopped
    volumes:
      - dados:/trab2/dados
    environment:
      - TZ=America/Sao_Paulo
      - LOG_LEVEL=INFO
    # Mantém a aplicação viva por 24h: relatório a cada 1h.
    command: >
      sh -c "while true; do
               echo '[$(date -Iseconds)] gerando relatório de risco';
               python main.py --relatorio || echo '[ERRO] falha no relatório';
               sleep 3600;
             done"
    healthcheck:
      test: ["CMD", "python", "main.py", "--relatorio"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dados:
    driver: local